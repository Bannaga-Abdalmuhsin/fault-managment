<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="shadow-dn" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <filter id="glow-dn" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="shadow-ellipse-dn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="38" cy="59" rx="16" ry="4" fill="url(#shadow-ellipse-dn)"/>

  <!-- Truck bed -->
  <g filter="url(#shadow-dn)">
    <polygon points="14,47 46,47 54,41 22,41" fill="#E8E8E8"/>
    <polygon points="14,47 22,41 22,50 14,56" fill="#C8C8C8"/>
    <polygon points="46,47 54,41 54,50 46,56" fill="#BDBDBD"/>
    <polygon points="14,56 22,50 54,50 46,56" fill="#D0D0D0"/>
    <!-- Cab -->
    <polygon points="40,41 54,41 54,34 40,34" fill="#F0F0F0"/>
    <polygon points="34,46 40,41 40,34 34,40" fill="#E0E0E0"/>
    <polygon points="40,34 54,34 52,32 38,32" fill="#FAFAFA"/>
    <polygon points="43,33.5 51,33.5 52,32 42,32" fill="#90CAF9" opacity="0.85"/>
  </g>

  <!-- Tower legs (red) -->
  <g filter="url(#glow-dn)" opacity="0.95">
    <line x1="24" y1="41" x2="22" y2="10" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="32" y1="41" x2="30" y2="10" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="24" y1="41" x2="30" y2="28" stroke="#EF4444" stroke-width="1.2" opacity="0.8"/>
    <line x1="32" y1="41" x2="22" y2="28" stroke="#EF4444" stroke-width="1.2" opacity="0.8"/>
    <line x1="23" y1="28" x2="29" y2="18" stroke="#EF4444" stroke-width="1.2" opacity="0.8"/>
    <line x1="30" y1="28" x2="22" y2="18" stroke="#EF4444" stroke-width="1.2" opacity="0.8"/>
    <line x1="28" y1="41" x2="26" y2="6" stroke="#EF4444" stroke-width="1" opacity="0.6"/>

    <!-- Antenna panel (left) -->
    <rect x="19" y="7" width="3.5" height="10" rx="0.5" fill="#E0E0E0" stroke="#EF4444" stroke-width="0.8"/>
    <!-- Antenna panel (right) -->
    <rect x="31" y="7" width="3.5" height="10" rx="0.5" fill="#E0E0E0" stroke="#EF4444" stroke-width="0.8"/>
    <!-- Top crossbar -->
    <line x1="20" y1="7" x2="34" y2="7" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Equipment box -->
    <rect x="24" y="9" width="6" height="5" rx="0.8" fill="#D8D8D8" stroke="#EF4444" stroke-width="0.7"/>
  </g>

  <!-- Glow halo -->
  <ellipse cx="27" cy="10" rx="9" ry="5" fill="#EF4444" opacity="0.2"/>

  <!-- X badge for down -->
  <circle cx="51" cy="24" r="5.5" fill="#EF4444" stroke="white" stroke-width="1.2"/>
  <line x1="48.5" y1="21.5" x2="53.5" y2="26.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="53.5" y1="21.5" x2="48.5" y2="26.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
</svg>
