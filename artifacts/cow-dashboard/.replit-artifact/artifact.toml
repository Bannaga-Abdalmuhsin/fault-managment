kind = "web"
previewPath = "/"
title = "COW Sites Hajj Dashboard"
version = "1.0.0"
id = "artifacts/cow-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23008

[services.development]
run = "pnpm --filter @workspace/cow-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cow-dashboard", "run", "build" ]
publicDir = "artifacts/cow-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23008"
BASE_PATH = "/"
